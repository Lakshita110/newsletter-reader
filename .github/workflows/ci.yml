name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # postinstall runs `prisma generate`, which only needs the schema (no DB).
      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # Typecheck the whole project; catches breakages the linter misses.
      - name: Typecheck
        run: npx tsc --noEmit

      - name: Test
        run: npm run test

      # Catches route-level wiring the unit tests can't (a broken build
      # otherwise passes CI). No DB is needed: pages that touch Prisma are
      # dynamic and don't run at build time.
      - name: Build
        run: npm run build
        env:
          DATABASE_URL: "postgresql://ci:ci@localhost:5432/ci"
